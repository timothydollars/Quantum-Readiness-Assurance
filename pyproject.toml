[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qraf"
version = "0.1.0.dev0"
description = "Quantum-Readiness Assurance Framework: CBOM-Lite inventory and QESM exposure scoring"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Timothy Olatunji Ogundola" }]
dependencies = ["cryptography>=42", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "cyclonedx-python-lib[json-validation]>=8"]
scan = ["sslyze>=6"]

[project.scripts]
qraf = "qraf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
